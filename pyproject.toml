[project]
name = "datheon-generative-ai-internship"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "datasets>=5.1.0",
    "ddgs>=9.16.1",
    "docx2txt>=0.9",
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.42.1",
    "pydantic>=2.14.2",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "rapidocr>=3.10.0",
    "rapidocr-onnxruntime>=1.4.4",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]
rnd = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "kagglehub>=1.0.3",
    "pandas>=3.1.0",
    "pdfplumber>=0.11.10",
    "requests>=2.34.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W = pycodestyle (PEP 8), F = pyflakes (unused imports), I = import sorting,
# UP = modern syntax, B = common bugs
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["01_Hirelyzer", "02_DocQA_RAG", "04_DocQA_Streamlit"]
testpaths = ["01_Hirelyzer/tests", "02_DocQA_RAG/tests", "04_DocQA_Streamlit/tests"]
addopts = "--import-mode=importlib"
