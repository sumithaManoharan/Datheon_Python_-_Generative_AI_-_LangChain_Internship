[project]
name = "datheon-generative-ai-internship"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "kagglehub>=1.0.3",
    "openai>=3.42.1",
    "pandas>=3.1.0",
    "pathlib>=1.0.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.2",
    "pymupdf4llm>=2.1",
    "python-dotenv>=1.2.4",
    "rapidocr>=3.10.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
